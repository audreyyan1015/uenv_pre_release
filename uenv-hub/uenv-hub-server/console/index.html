<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>UEnv Hub 控制台</title>
    <link rel="stylesheet" href="/console/app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23202b3f'/%3E%3Cpath d='M8 11.5 16 7l8 4.5v9L16 25l-8-4.5z' fill='none' stroke='%237aa2f7' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="26" height="26">
              <path
                d="M8 11.5 16 7l8 4.5v9L16 25l-8-4.5z"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linejoin="round"
              />
              <path d="M16 16v9M8 11.5 16 16l8-4.5" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55" />
            </svg>
          </div>
          <div class="brand-text">
            <strong>UEnv Hub</strong>
            <span id="brand-version">环境注册中心</span>
          </div>
        </div>

        <nav class="nav" id="nav">
          <div class="nav-group">运行态</div>
          <a class="nav-item" href="#/overview" data-route="overview"><span class="ico">◈</span>总览</a>
          <a class="nav-item" href="#/health" data-route="health"><span class="ico">◉</span>健康与指标</a>

          <div class="nav-group">注册内容</div>
          <a class="nav-item" href="#/envs" data-route="envs"><span class="ico">▤</span>环境<em id="c-envs"></em></a>
          <a class="nav-item" href="#/packages" data-route="packages"><span class="ico">▣</span>环境包<em id="c-packages"></em></a>
          <a class="nav-item" href="#/stacks" data-route="stacks"><span class="ico">▦</span>Episode Stack<em id="c-stacks"></em></a>
          <a class="nav-item" href="#/bridges" data-route="bridges"><span class="ico">⛓</span>Agent Bridge<em id="c-bridges"></em></a>
          <a class="nav-item" href="#/swe" data-route="swe"><span class="ico">✦</span>SWE 实例目录</a>
          <a class="nav-item" href="#/templates" data-route="templates"><span class="ico">◇</span>脚手架模板<em id="c-templates"></em></a>

          <div class="nav-group">运维</div>
          <a class="nav-item" href="#/search" data-route="search"><span class="ico">⌕</span>搜索</a>
          <a class="nav-item" href="#/audit" data-route="audit"><span class="ico">☰</span>审计日志</a>
          <a class="nav-item" href="#/settings" data-route="settings"><span class="ico">⚙</span>连接与凭据</a>
        </nav>

        <div class="sidebar-foot">
          <div class="foot-row"><span>端点</span><code id="foot-endpoint">—</code></div>
          <div class="foot-row"><span>凭据</span><code id="foot-token">—</code></div>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div class="crumbs" id="crumbs">总览</div>
          <div class="topbar-actions">
            <span class="pill" id="health-pill" title="来自 /healthz">
              <i class="dot dot-pending"></i><span id="health-text">检测中</span>
            </span>
            <span class="pill muted" id="uptime-pill" hidden></span>
            <label class="switch" title="每 10 秒重新拉取当前视图">
              <input type="checkbox" id="autorefresh" />
              <span>自动刷新</span>
            </label>
            <button class="btn" id="refresh-btn" title="立即刷新当前视图">刷新</button>
          </div>
        </header>

        <main class="content" id="view" aria-live="polite"></main>
      </div>
    </div>

    <div class="toast-stack" id="toasts"></div>

    <script src="/console/app.js"></script>
  </body>
</html>
