# UEnv Worker — A100 7143 SWE Pro + SWE-smith 联调
# 在既有 Pro Gateway 配置上叠加本地 Smith EnvPackage（不经 Hub）
# 公网：gRPC 28888 / health 28777 / Runtime Gateway 28097
server:
  endpoint: "8.130.75.157:8088"

worker:
  id: "worker-7143-pro"
  listen: "0.0.0.0:28888"
  advertise_endpoint: "219.147.100.43:28888"
  max_concurrent: 4

scheduler:
  mode: "remote"

env:
  types: ["qa", "code", "swe"]
  backend: "process"
  plugin_dir: "/root/UEnv/plugins"

pool:
  warmup_size: 4
  prewarm_on_startup: true
  max_idle_time: 300
  cool_timeout: 60
  max_episode_count: 1000

logging:
  level: "INFO"
  file: "/var/log/uenv/worker-swe-pro.log"

wal:
  dir: "/tmp/uenv/wal-swe"

llm:
  env_file: "config/uenv-worker-llm.env"

observability:
  metrics_listen: "0.0.0.0:28777"
  health_listen: "0.0.0.0:28777"

hub:
  enabled: true
  endpoint: "http://8.130.95.176:8088"

swe:
  variants: ["pro", "smith"]
  # Pro 为主包（含 image tar）；Smith 本地包合并 catalog（镜像已 docker pull）
  env_package_dir: "/var/lib/uenv/envs/swe-bench-pro/0.3.4"
  env_package_dirs:
    - "/var/lib/uenv/envs/swe-bench-smith/0.1.0-local"
  warm_tag: true

runtime_gateway:
  enabled: true
  listen: "0.0.0.0:28097"
  capacity: 1
  api_key: "REPLACE_WITH_RANDOM_GATEWAY_API_KEY"

trajectory_upload:
  endpoint: "http://8.130.75.157:8077"
