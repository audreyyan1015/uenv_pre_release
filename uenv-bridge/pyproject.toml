[project]
name = "uenv-bridge"
version = "0.1.0"
description = "UEnv Bridge - Training framework adapters"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.82.1",
    "grpcio-tools>=1.82.1",
    "protobuf>=7.35.0",
    "pyyaml>=6.0",
    "starlette>=0.37",
]

[project.scripts]
uenv-bridge = "uenv.bridge.cli:main"
uenv-evaluate = "uenv.bridge.evaluate:main"
